name: release

# 태그(v4.7 등)를 올리면 릴리스를 만든다. 리눅스는 소스 배포(install.sh)라
# 첨부 바이너리는 없고, 릴리스 노트만 붙는다.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "릴리스할 태그 (예: v4.7)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - id: pick
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+$ ]]; then
            echo "태그는 v4.7 형식이어야 합니다 (받은 값: $TAG)"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.pick.outputs.tag }}

      - name: 릴리스 만들기 또는 갱신
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.pick.outputs.tag }}
        run: |
          NOTES="docs/release-notes/$TAG.md"
          if [ -f "$NOTES" ]; then
            NOTES_ARG=(--notes-file "$NOTES")
          else
            NOTES_ARG=(--notes "$TAG")
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" "${NOTES_ARG[@]}"
          else
            gh release create "$TAG" --title "$TAG" "${NOTES_ARG[@]}"
          fi
          gh release view "$TAG"
